<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Image Resizer</title>
    <link rel="stylesheet" href="homePage.css">
</head>

<body>

    <h1 class="app-title">Social Media Image Resizer</h1>

    <div class="image-preview">
        <img id="previewImage" />
    <button id="resizeBtn" class="tile main-buttons" disabled>
        Resize Image
    </button>
    </div>

    <div class="container">
        <h3>Upload Image</h3>

        <label for="fileUpload" class="tile">Upload</label>
        <input type="file" id="fileUpload" accept=".jpg,.jpeg,.png" hidden>
    </div>

    <div id="results"></div>
    <script>
    const fileInput = document.getElementById("fileUpload");
    const previewImage = document.getElementById("previewImage");
    const resizeBtn = document.getElementById("resizeBtn");
   const PLATFORM_MAP = {
    "Facebook": [
        { label: "Vertical Post", size: "1080x1440" },
        { label: "Reels & Story", size: "1080x1920" },
        { label: "Square", size: "1080x1080" },
        { label: "Landscape", size: "1080x566" }
    ],

    "X / Twitter": [
        { label: "Post", size: "1080x1080" },
        { label: "Landscape Post", size: "1600x900" },
        { label: "Landscape", size: "1280x720" },
        { label: "Vertical", size: "720x1280" }
    ],

    "LinkedIn": [
        { label: "Square", size: "1200x1200" },
        { label: "Landscape", size: "1200x627" },
        { label: "Vertical", size: "720x900" }
    ],

    "YouTube": [
        { label: "Shorts Thumbnail", size: "1080x1920" }
    ],

    "TikTok": [
        { label: "Thumbnail & Video", size: "1080x1920" }
    ],

    "Instagram": [
        { label: "3:4 & Portrait & Reel Thumbnail", size: "1080x1440" },
        { label: "Reels & Story", size: "1080x1920" },
        { label: "Square", size: "1080x1080" },
        { label: "Landscape", size: "1080x566" }
    ]
};

    let selectedFile = null;

     // runs when user selects a file
    fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        selectedFile = file;

        // preview
        previewImage.src = URL.createObjectURL(file);
        //allows image to be displayed after being uploaded
        previewImage.style.display = "block";

        // enable button for resizing
        resizeBtn.disabled = false;
    });
    //runs when user clicks the resize button
    resizeBtn.addEventListener("click", async function () {
        if (!selectedFile) return;

        // once pressed, disable button and change text to show processing
        resizeBtn.disabled = true;
        resizeBtn.innerText = "Processing...";
        // sets up the given file for processing and sends it to the backend
        const formData = new FormData();
        formData.append("file", selectedFile);
        //send to upload point of backend
        const res = await fetch("http://localhost:5000/upload", {
            method: "POST",
            body: formData
        });
        //converts response to json and gets the file name
        const data = await res.json();
        //gets file name
        const filename = data.filename;
        //specifically has the website wait to allow time for the backend to do its processing and resizing.
        setTimeout(async () => {
            const res2 = await fetch(`http://localhost:5000/list?name=${filename}`);
            //calls for list of files in output bucket
            const data2 = await res2.json();
            //displays the links to the resized images
            showLinks(data2.formats);

            resizeBtn.innerText = "Resize Image";
            resizeBtn.disabled = false;

        }, 13000);
    });
function groupByPlatform(formats) {
    const grouped = {};

    for (const size in formats) {
        //formats the sizes to match frontend map
        const key = size.replace("(", "").replace(")", "").replace(", ", "x");
        //looks up the platform and label based on the size
        const meta = SIZE_MAP[key];
        //if no platform, continue
        if (!meta) continue;
        //Labels and platform are stored in map based on size
        const { platform, label } = meta;
        //groups sizes by platform
        if (!grouped[platform]) {
            grouped[platform] = [];
        }
        //outputs size label and type to platform group
        grouped[platform].push({
            size: key,
            label,
            modes: formats[size]
        });
    }
    //returns final outputs
    return grouped;
}

//its the same sizes but backend just returns them differently, so this just makes it so it matches the const map
function normalizeSize(size) {
    return size.replace(/[()]/g, "").replace(", ", "x");
}

    function showLinks(formats) {
        //const baseURL = "https://storage.googleapis.com/media_image_resized_bucket/";
        //displays the links to the resized images
        const results = document.getElementById("results");
        results.innerHTML = "<h2>Resized Images:</h2>";
        //if no files, let user know no images were found
        if (!formats || Object.keys(formats).length === 0) {
            results.innerHTML += "<p>No images found.</p>";
            return;
        }

       // normalize the formats to match the frontend map
    const normalizedFormats = {};
    for (const rawSize in formats) {
        const cleanSize = normalizeSize(rawSize);
        normalizedFormats[cleanSize] = formats[rawSize];
    }

    // groups formats by platform
    for (const platform in PLATFORM_MAP) {
        const section = document.createElement("div");
        //platform
        const title = document.createElement("h2");
        title.textContent = platform;
        section.appendChild(title);
        //table for each platform with type, size, and links
        const table = document.createElement("table");
        table.border = "1";
        table.style.borderCollapse = "collapse";
        table.style.marginBottom = "20px";
        //header titles for the tables
        const header = document.createElement("tr");
        header.innerHTML = `
            <th>Type</th>
            <th>Resolution</th>
            <th>Links</th>
        `;
        table.appendChild(header);
        //loops through each size and assigns them to correct platform with their types
        PLATFORM_MAP[platform].forEach(item => {
            const row = document.createElement("tr");

            const typeCell = document.createElement("td");
            typeCell.textContent = item.label;

            const sizeCell = document.createElement("td");
            sizeCell.textContent = item.size;

            const linksCell = document.createElement("td");

            const modes = normalizedFormats[item.size];
            //adds the links for the sizes to their specific platforms
            if (modes) {
                for (const mode in modes) {
                    const link = document.createElement("a");
                    link.href = modes[mode];
                    link.target = "_blank";
                    link.textContent = mode;
                    link.style.marginRight = "10px";

                    linksCell.appendChild(link);
                }
            } else { // if no links exist, just display that they were not generated
                linksCell.textContent = "Not Generated";
            }
            //Adds the type, size, and links to the row, then adds the row to the table
            row.appendChild(typeCell);
            row.appendChild(sizeCell);
            row.appendChild(linksCell);
            //adds the row to the table
            table.appendChild(row);
        });
        //adds the table to the section, then adds the section to the 
        section.appendChild(table);
        results.appendChild(section);
    
    }
    }
</script>

</body>

</html>
